<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACE AI - AI-Powered Event Intelligence for a Brighter Future</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#faf5ff',
              100: '#f3e8ff',
              200: '#e9d5ff',
              300: '#d8b4fe',
              400: '#c084fc',
              500: '#a855f7',
              600: '#9333ea',
              700: '#7e22ce',
              800: '#6b21a8',
              900: '#581c87',
              950: '#3b0764',
            }
          }
        }
      }
    }
  </script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased selection:bg-purple-100 selection:text-purple-900">

  <!-- ========================================== -->
  <!-- TOP DEMO EVALUATION BAR -->
  <!-- ========================================== -->
  <header class="bg-slate-900 text-white text-xs border-b border-slate-800 sticky top-0 z-40 px-4 py-2 flex flex-wrap items-center justify-between gap-3 shadow-md">
    <div class="flex items-center gap-2 font-bold tracking-tight">
      <span class="w-2.5 h-2.5 rounded-full bg-purple-500 animate-pulse"></span>
      <span class="text-purple-400 font-black tracking-wider uppercase text-[11px]">ACE AI Live Demo</span>
      <span class="text-slate-500 hidden sm:inline">• HackGURU 2.1 AI Solution Area</span>
    </div>

    <!-- Switcher Buttons -->
    <div class="flex items-center gap-1.5 overflow-x-auto py-0.5">
      <span class="text-[11px] text-slate-400 mr-1 hidden md:inline">Switch Demo Profile:</span>
      
      <button onclick="window.app.loginDemo('student1')" data-demo-user="student1" class="demo-switch-btn px-2.5 py-1 rounded-lg text-xs font-semibold bg-white text-slate-700 hover:bg-purple-50 transition-colors flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-purple-500"></span>
        <span>Jaya (AI & DS)</span>
      </button>

      <button onclick="window.app.loginDemo('student2')" data-demo-user="student2" class="demo-switch-btn px-2.5 py-1 rounded-lg text-xs font-semibold bg-white text-slate-700 hover:bg-purple-50 transition-colors flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
        <span>Alex (CS Web)</span>
      </button>

      <button onclick="window.app.loginDemo('student3')" data-demo-user="student3" class="demo-switch-btn px-2.5 py-1 rounded-lg text-xs font-semibold bg-white text-slate-700 hover:bg-purple-50 transition-colors flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-red-500"></span>
        <span>Sam (Cyber Sec)</span>
      </button>

      <button onclick="window.app.loginDemo('organizer')" data-demo-user="organizer" class="demo-switch-btn px-2.5 py-1 rounded-lg text-xs font-semibold bg-white text-slate-700 hover:bg-purple-50 transition-colors flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span>Organizer</span>
      </button>
    </div>

    <!-- Current User Badge -->
    <div class="flex items-center gap-2 cursor-pointer hover:opacity-90" onclick="window.app.navigate('profile')">
      <img id="header-user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80" alt="Avatar" class="w-6 h-6 rounded-full object-cover border border-purple-400">
      <div class="hidden sm:block text-left">
        <div id="header-user-name" class="font-bold text-[11px] leading-tight text-white">Jaya Sundaram</div>
        <div id="header-user-role" class="text-[9px] text-purple-300 leading-tight">ML Engineer</div>
      </div>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- MAIN APPLICATION SHELL -->
  <!-- ========================================== -->
  <div class="flex-1 flex w-full">
    
    <!-- SIDEBAR NAVIGATION -->
    <aside id="app-sidebar" class="w-64 bg-white border-r border-slate-200 hidden lg:flex flex-col justify-between p-4 sticky top-12 h-[calc(100vh-48px)]">
      <div class="space-y-6">
        <!-- Logo -->
        <div class="flex items-center gap-2.5 px-3 py-2 cursor-pointer" onclick="window.app.navigate('landing')">
          <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-purple-700 to-indigo-600 text-white flex items-center justify-center font-black text-xs shadow-md shadow-purple-200">ACE</div>
          <div>
            <div class="font-black text-lg text-slate-900 tracking-tight leading-none">ACE AI</div>
            <div class="text-[10px] text-purple-600 font-bold uppercase tracking-wider">AI Recommendation</div>
          </div>
        </div>

        <!-- Navigation Links -->
        <nav class="space-y-1">
          <button onclick="window.app.navigate('dashboard')" data-view="dashboard" class="sidebar-nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-bold transition-all text-slate-600 hover:bg-purple-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span>Dashboard</span>
          </button>

          <button onclick="window.app.navigate('discover')" data-view="discover" class="sidebar-nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-bold transition-all text-slate-600 hover:bg-purple-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16l2.879-2.879m0 0a3 3 0 104.243-4.242 3 3 0 00-4.243 4.242zM21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span>Discover Events</span>
          </button>

          <button onclick="window.app.navigate('for-you')" data-view="for-you" class="sidebar-nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-bold transition-all text-slate-600 hover:bg-purple-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
            <span>For You</span>
            <span class="ml-auto px-2 py-0.5 rounded-full bg-purple-100 text-purple-700 text-[10px] font-bold">AI</span>
          </button>

          <button onclick="window.app.navigate('saved-events')" data-view="saved-events" class="sidebar-nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-bold transition-all text-slate-600 hover:bg-purple-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
            <span>Saved Events</span>
          </button>

          <button onclick="window.app.navigate('my-registrations')" data-view="my-registrations" class="sidebar-nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-bold transition-all text-slate-600 hover:bg-purple-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
            <span>My Registrations</span>
          </button>

          <button onclick="window.app.navigate('profile')" data-view="profile" class="sidebar-nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-bold transition-all text-slate-600 hover:bg-purple-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span>Profile & Skills</span>
          </button>

          <div class="pt-3 pb-1">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-3">Organizer Tools</div>
          </div>

          <button onclick="window.app.navigate('organizer-dashboard')" data-view="organizer-dashboard" class="sidebar-nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-bold transition-all text-slate-600 hover:bg-purple-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            <span>Organizer Hub</span>
          </button>

          <button onclick="window.app.navigate('create-event')" data-view="create-event" class="sidebar-nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-bold transition-all text-slate-600 hover:bg-purple-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span>Create Event (AI)</span>
          </button>
        </nav>
      </div>

      <!-- Bottom Settings Link -->
      <div class="pt-4 border-t border-slate-100">
        <button onclick="window.app.navigate('settings')" data-view="settings" class="sidebar-nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-bold transition-all text-slate-600 hover:bg-purple-50">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span>Settings & Privacy</span>
        </button>
      </div>
    </aside>

    <!-- CONTENT WRAPPER -->
    <main class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8">
      <div id="app-main-content" class="max-w-7xl mx-auto">
        <!-- Views are rendered dynamically here -->
      </div>
    </main>
  </div>

  <!-- ========================================== -->
  <!-- MOBILE BOTTOM NAVIGATION -->
  <!-- ========================================== -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40 px-3 py-2 flex justify-around shadow-lg">
    <button onclick="window.app.navigate('dashboard')" class="flex flex-col items-center gap-1 text-slate-600 hover:text-purple-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span class="text-[10px] font-bold">Home</span>
    </button>
    <button onclick="window.app.navigate('discover')" class="flex flex-col items-center gap-1 text-slate-600 hover:text-purple-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16l2.879-2.879m0 0a3 3 0 104.243-4.242 3 3 0 00-4.243 4.242zM21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span class="text-[10px] font-bold">Discover</span>
    </button>
    <button onclick="window.app.navigate('for-you')" class="flex flex-col items-center gap-1 text-purple-600 font-bold">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
      <span class="text-[10px] font-bold">For You</span>
    </button>
    <button onclick="window.app.navigate('saved-events')" class="flex flex-col items-center gap-1 text-slate-600 hover:text-purple-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
      <span class="text-[10px] font-bold">Saved</span>
    </button>
    <button onclick="window.app.navigate('profile')" class="flex flex-col items-center gap-1 text-slate-600 hover:text-purple-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-[10px] font-bold">Profile</span>
    </button>
  </nav>

  <!-- ========================================== -->
  <!-- TOAST NOTIFICATION CONTAINER -->
  <!-- ========================================== -->
  <div id="toast-container"></div>

  <!-- APPLICATION MODULES SCRIPT -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
